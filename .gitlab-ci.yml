workflow:
 rules:
   - if: '$CI_PIPELINE_SOURCE == "push"'
     when: never
   - when: always

variables:
  CI_RUN_COMPONENTS_JOBS:
    value: "0"
    description: "Set to 1 to actually run component update jobs (kernel, pulseaudio-headers, etc.)"
  GITHUB_API_TOKEN:
    value: ""
    description: "GitHub API token used to check for updates and open pull requests"
  DEBUG:
    value: "1"
    description: "Enable shell trace output (set -x) in updater scripts"
  FETCH_CMD:
    value: "curl --proto '=https' --proto-redir '=https' --tlsv1.2 --http1.1 -sSfL -o"
    description: "curl invocation used to download files in updater scripts"

default:
  tags:
    - qubes-components-updater

stages:
  - prep
  - build
  - upload

.component-job:
  stage: build
  rules:
    - if: '$CI_RUN_COMPONENTS_JOBS == "1"'
      when: always
    - when: never

