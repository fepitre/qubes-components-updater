.kernel-job:
  extends: .component-job
  before_script:
    - sudo dnf install -y python3-requests python3-packaging python3-pygithub python3-jwt python3-gitlab bison flex python3-koji gnupg2
  script: ./kernel-updater.sh
#  needs:
#    - linux-clone

linux-main:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: main

linux-6.18:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: "stable-6.18"

linux-6.12:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: "stable-6.12"

linux-6.6:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: "stable-6.6"

linux-6.1:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: "stable-6.1"

linux-5.15:
  extends: .kernel-job
  variables:
    BRANCH_linux_kernel: "stable-5.15"

### pulseaudio-headers

pulseaudio-headers:
  extends: .component-job
  script: ./pulseaudio-updater.sh
